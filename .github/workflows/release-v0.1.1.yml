name: Publish ATHLTH Home Assistant v0.1.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish v0.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo "v0.1.1 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.1.1 \
            --target "${GITHUB_SHA}" \
            --title "0.1.1" \
            --notes "ATHLTH Home Assistant 0.1.1

          Fixes:
          - Fixes setup failure when Home Assistant cannot provide an absolute webhook URL during config-entry setup.
          - Resolves the webhook URL from the authenticated pairing request instead.
          - Includes the expanded ATHLTH sensor, calendar, event, command and background-sync implementation.
          - Validated against Home Assistant 2026.9.4 and 2026.10 beta.
          - Full repository privacy scan and hassfest validation pass."
