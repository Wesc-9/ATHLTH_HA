name: Publish ATHLTH Home Assistant v0.3.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.3.2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt "homeassistant==2026.9.4"
      - name: Run security and integration tests
        env:
          PYTHONPATH: .
        run: |
          python scripts/privacy_scan.py
          pytest -q
          python -c 'import json; assert json.load(open("custom_components/athlth/manifest.json"))["version"] == "0.3.2"'

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested v0.3.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.2 >/dev/null 2>&1; then
            echo "v0.3.2 already exists; nothing to do."
            exit 0
          fi
          gh release create v0.3.2 \
            --target "${GITHUB_SHA}" \
            --title "0.3.2" \
            --notes "ATHLTH Home Assistant 0.3.2: Adds pairing-code support for Tailscale shared-address-space clients while preserving short-lived code limits; documents secure HTTPS Tailscale Serve access and local plus VPN routing; includes pairing boundary security tests."
