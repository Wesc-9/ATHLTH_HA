name: Publish ATHLTH Home Assistant v0.5.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.5.1.yml

permissions:
  contents: read

concurrency:
  group: athlth-hacs-release-v0.5.1
  cancel-in-progress: false

jobs:
  verify:
    name: Release checks HA ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant:
          - "2026.9.4"
          - "2026.10.0b0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install testing dependencies
        run: python -m pip install -r requirements_test.txt "homeassistant==${{ matrix.homeassistant }}"
      - name: Assert release package version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("custom_components/athlth/manifest.json").read_text())
          assert manifest["version"] == "0.5.1", manifest["version"]
          assert Path("docs/releases/v0.5.1.md").is_file()
          PY
      - name: Validate privacy and regression suite
        env:
          PYTHONPATH: .
        run: |
          python scripts/privacy_scan.py
          pytest -q
      - name: Validate frontend syntax and cards
        run: |
          node --check custom_components/athlth/frontend/athlth-cards.js
          node --test tests/test_lovelace_cards.cjs

  hassfest:
    name: Release Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Release HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  publish:
    name: Publish tested v0.5.1 GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, hassfest, hacs]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.1 >/dev/null 2>&1; then
            echo "v0.5.1 is already published; refusing to overwrite it."
            exit 1
          fi
      - name: Publish tested v0.5.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.5.1 \
            --target "$GITHUB_SHA" \
            --title "ATHLTH Home Assistant v0.5.1" \
            --notes-file docs/releases/v0.5.1.md \
            --latest
