# ATHLTH iPad — EKTE HOME ASSISTANT-SEKSJONER
#
# Oversikt er en native Home Assistant Sections-visning, IKKE Panel og IKKE
# ett stort custom:athlth-dashboard-card. Det finnes 7 reelle seksjoner.
# Opptil 3 seksjoner ligger side ved side, begrenset av faktisk skjermbredde
# etter at venstre Home Assistant-sidefelt er trukket fra. På smale iPads
# flyttes seksjonene automatisk til 2 eller 1 kolonne uten horisontal scroll.
#
# Beholder Home Assistant-menyen til VENSTRE; ikke bruk hide_sidebar,
# hide_header eller den eksterne kiosk-mode-integrasjonens fullscreen.
# Lag et eget brukeradministrert dashboard og aktiver "Vis i sidefelt".
#
# GitHub-oppdateringer endrer ikke en allerede opprettet HA-visning.
# Kopier YAML inn i dashboardets Råkonfigurasjonsredigerer.
# Sensor-ID må samsvare med den faktiske ATHLTH-installasjonen i HA.
#
title: ATHLTH iPad
views:
  - title: Oversikt
    path: oversikt
    icon: mdi:view-dashboard-outline
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Nå og neste
            heading_style: title
            icon: mdi:calendar-clock
          - type: custom:athlth-status-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-today-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-tomorrow-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-active-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Siste treningsøkt
            heading_style: title
            icon: mdi:run-fast
          - type: custom:athlth-last-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-feed-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Denne uken
            heading_style: title
            icon: mdi:chart-box-outline
          - type: custom:athlth-week-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-trend-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-rhythm-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Treningsplan
            heading_style: title
            icon: mdi:calendar-check-outline
          - type: custom:athlth-plan-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-calendar-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-next-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Belastning og dagsform
            heading_style: title
            icon: mdi:heart-pulse
          - type: custom:athlth-recovery-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-mix-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-insight-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Personlige rekorder
            heading_style: title
            icon: mdi:trophy-outline
          - type: custom:athlth-records-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-long-trend-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-strength-progress-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Mål og datakvalitet
            heading_style: title
            icon: mdi:target
          - type: custom:athlth-goals-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-data-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto

  # Reserveløsning / familiemodus: det gamle kombikortet i full bredde.
  - title: Samlet
    path: samlet
    icon: mdi:monitor-dashboard
    type: panel
    cards:
      - type: custom:athlth-dashboard-card
        kiosk: true
        members:
          - name: Min trening
            entity: sensor.athlth_last_workout

# Seksjonene på Oversikt følger ett valgt sensor-anker. Bruk Samlet-fanen
# for å veksle mellom familiemedlemmer via den eksisterende velgeren.
