# ATHLTH standard dashboard — native Home Assistant Sections first.
# The first ATHLTH view has seven sections and 20 separate custom cards
# (not one combined Panel card). Home Assistant arranges up to 3 sections
# side by side according to actual available width, including the left
# sidebar. The combined legacy view is preserved as the "Samlet" tab.
#
# Import this example through a user-managed dashboard YAML editor in HA.
# GitHub source updates do not automatically replace an existing view.
# All numbers, records, charts and routes come only from real ATHLTH data
# received through the integration; no demonstration values are invented.
# For Home Assistant iPad specifically, see examples/ipad-kiosk-dashboard.yaml.
# Change the entity ID if yours is not sensor.athlth_last_workout.
title: ATHLTH
views:
  - title: ATHLTH
    path: athlth
    icon: mdi:view-dashboard-outline
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Nå og neste
            heading_style: title
            icon: mdi:calendar-clock
          - type: custom:athlth-status-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-today-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-tomorrow-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-active-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Siste treningsøkt
            heading_style: title
            icon: mdi:run-fast
          - type: custom:athlth-last-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-feed-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Denne uken
            heading_style: title
            icon: mdi:chart-box-outline
          - type: custom:athlth-week-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-trend-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-rhythm-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Treningsplan
            heading_style: title
            icon: mdi:calendar-check-outline
          - type: custom:athlth-plan-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-calendar-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-next-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Belastning og dagsform
            heading_style: title
            icon: mdi:heart-pulse
          - type: custom:athlth-recovery-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-mix-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-insight-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Personlige rekorder
            heading_style: title
            icon: mdi:trophy-outline
          - type: custom:athlth-records-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-long-trend-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-strength-progress-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Mål og datakvalitet
            heading_style: title
            icon: mdi:target
          - type: custom:athlth-goals-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto
          - type: custom:athlth-data-card
            entity: sensor.athlth_last_workout
            grid_options:
              columns: 12
              rows: auto

  - title: Samlet
    path: samlet
    icon: mdi:monitor-dashboard
    type: panel
    cards:
      - type: custom:athlth-dashboard-card
        kiosk: true
        members:
          - name: Min trening
            entity: sensor.athlth_last_workout

  - title: Trening
    path: trening
    icon: mdi:dumbbell
    cards:
      - type: custom:athlth-status-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-week-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-today-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-plan-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-last-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-calendar-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-history-card
        entity: sensor.athlth_last_workout

