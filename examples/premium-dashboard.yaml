# ATHLTH premium dashboard – entire dashboard in one configurable card.
# Choose a new dashboard in Home Assistant (manual YAML).
# Use a PANEL view for this combined card; placing it inside a masonry column
# constrains its width and will prevent the three-column desktop layout.
# Home Assistant iPad app: if you only see one card across, the first view is
# likely configured as default Masonry rather than Panel. Edit the ATHLTH view
# and select Panel (one card), or use Sections with a 12-column-wide ATHLTH
# dashboard card. Panel layout is separate from the card's internal grid.
# Scroll position is preserved during incoming HA entity updates in v0.5.1.
# 3 columns require about 790 CSS pixels of real card width; 620-789 gets 2.
# Narrow/split-screen iPad windows intentionally get 1 column.

# There is no demo data: every value comes from the connected ATHLTH devices.
# The four sections are rendered within one full-width dashboard card:
# NOW/NEXT, TRAINING FOUNDATION, PATTERNS, TRAINING INSIGHTS.
# The recent activity bar chart and activity mix use only the last 10 received
# completed workouts. They do not claim to represent full workout history.
# Tomorrow is based only on dated and planned ATHLTH calendar/next-workout data.
# Athlete photo/name and performance records require explicit consent inside
# ATHLTH > Settings > Connections > Home Assistant. Profile sharing is OFF by default.
# New athlete snapshot features are only sent when HA advertises support.
# Each optional member must consent to sharing in their own ATHLTH app.
#
# All card types are bundled with ATHLTH_HA. Supported individual cards:
# athlth-week-card, athlth-today-card, athlth-next-card,
# athlth-last-card, athlth-plan-card, athlth-recovery-card,
# athlth-active-card, athlth-family-card, athlth-dashboard-card,
# athlth-calendar-card, athlth-goals-card, athlth-strength-card,
# athlth-history-card, athlth-status-card, athlth-tomorrow-card,
# athlth-trend-card, athlth-mix-card, athlth-rhythm-card,
# athlth-insight-card, athlth-feed-card, athlth-records-card,
# athlth-data-card.
#
# Primary installation uses sensor.athlth_last_workout.
# For additional accounts/devices, use the exact "Last workout" entity id
# from Settings > Devices & services > ATHLTH.
# Optional "entities" overrides let you map specific entity IDs manually.

title: ATHLTH
views:
  - title: ATHLTH
    path: athlth
    icon: mdi:run-fast
    # Panel lets the bundled card use the full screen. Its internal grid
    # becomes 3 columns on desktop, 2 on tablet and 1 on mobile.
    panel: true
    cards:
      - type: custom:athlth-dashboard-card
        members:
          - name: Min trening
            entity: sensor.athlth_last_workout

  - title: Trening
    path: trening
    icon: mdi:dumbbell
    cards:
      - type: custom:athlth-status-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-week-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-today-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-plan-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-last-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-calendar-card
        entity: sensor.athlth_last_workout
      - type: custom:athlth-history-card
        entity: sensor.athlth_last_workout

# Example for TWO voluntarily connected users:
# - type: custom:athlth-dashboard-card
#   members:
#     - name: Meg
#       entity: sensor.athlth_last_workout
#     - name: Samboer
#       entity: sensor.<actual_second_installation>_last_workout
#       # Enter exact IDs from HA; do not guess the extra client's slug.
#
# Standalone family card works on an existing dashboard:
# - type: custom:athlth-family-card
#   members:
#     - name: Meg
#       entity: sensor.athlth_last_workout
#     - name: Samboer
#       entity: sensor.<actual_second_installation>_last_workout
#
# Override sensor names when a custom entity ID or HA localization differs:
# - type: custom:athlth-recovery-card
#   entity: sensor.athlth_last_workout
#   entities:
#     recovery_score: sensor.athlth_recovery_score
#     sleep_duration: sensor.athlth_sleep_duration
#     hrv: sensor.athlth_hrv
#     resting_heart_rate: sensor.athlth_resting_heart_rate
